<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070b15" media="(prefers-color-scheme: dark)">
  <title>Network Observatory · Les protocoles d’Internet, paquet par paquet</title>
  <meta name="description" content="Regardez Internet fonctionner, paquet par paquet : 14 leçons animées (IP, ICMP, UDP, TCP, DHCP, DNS, HTTP, TLS 1.3, HTTPS, SMTP, POP3, IMAP, SSH, FTP), chaque paquet décodé octet par octet. En français et en anglais.">
  <meta name="author" content="Neosoda">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Network Observatory">
  <meta property="og:title" content="Network Observatory · Les protocoles d’Internet, paquet par paquet">
  <meta property="og:description" content="14 leçons animées, de TCP à TLS 1.3, avec chaque paquet décodé octet par octet.">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Theme before first paint: the saved choice, else the system's.
    try {
      const saved = localStorage.getItem('observatory:theme')
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    } catch { document.documentElement.dataset.theme = 'light' }
  </script>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>Network Observatory a besoin de JavaScript pour animer les paquets. · Network Observatory needs JavaScript to animate packets.</noscript>
</body>
</html>
